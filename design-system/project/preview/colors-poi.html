<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; font-family: var(--font-sans); color: var(--fg); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { display: flex; align-items: center; gap: 12px; }
  .marker { width: 30px; height: 30px; flex: 0 0 30px; display: flex; align-items: center; justify-content: center; }
  .name { font-size: 13px; font-weight: 500; }
  .sub { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
  .cap { width: 14px; height: 14px; background: #C41E24; border: 1.5px solid #1F1A14; }
  .bat { width: 14px; height: 14px; background: #E8553A; border: 1.5px solid #1F1A14; transform: rotate(45deg); }
  .pas { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid transparent; box-sizing: border-box; --c: #6B8E5A; border-bottom-color: transparent; position: relative; }
  .pas::after { content:""; position:absolute; left:-10px; top:0; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:16px solid #6B8E5A; }
  .city { width: 12px; height: 12px; background: #2B4490; border: 1.5px solid #1F1A14; border-radius: 50%; }
</style>
<body>
  <div class="label">POI MARKERS · 地图标注类型</div>
  <div class="row">
    <div class="item">
      <div class="marker"><div class="cap"></div></div>
      <div><div class="name">国都</div><div class="sub">--poi-capital</div></div>
    </div>
    <div class="item">
      <div class="marker"><div class="bat"></div></div>
      <div><div class="name">战场</div><div class="sub">--poi-battle</div></div>
    </div>
    <div class="item">
      <div class="marker"><svg width="22" height="20" viewBox="0 0 22 20"><path d="M11 2L21 18H1z" fill="none" stroke="#6B8E5A" stroke-width="2"/></svg></div>
      <div><div class="name">关隘 / 山川</div><div class="sub">--poi-pass</div></div>
    </div>
    <div class="item">
      <div class="marker"><div class="city"></div></div>
      <div><div class="name">城邑</div><div class="sub">--poi-city</div></div>
    </div>
  </div>
</body>
