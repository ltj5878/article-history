<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; color: var(--fg); }
  .label { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; align-items: end; }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .display { font-family: var(--font-display); font-size: 56px; line-height: 1; color: var(--fg); }
  .seal { font-family: var(--font-seal); font-size: 28px; letter-spacing: 0.18em; color: var(--c-vermillion); }
  .body { font-family: var(--font-serif); font-size: 18px; line-height: 1.9; color: var(--fg); }
</style>
<body>
  <div class="label">TYPE FAMILIES</div>
  <div class="row">
    <div class="item">
      <div class="display">城濮</div>
      <div class="meta">--font-display · Ma Shan Zheng · 行楷</div>
    </div>
    <div class="item">
      <div class="body">晋侯次于城濮，楚师败绩。</div>
      <div class="meta">--font-serif · Noto Serif SC · 18 / 1.9</div>
    </div>
    <div class="item">
      <div class="seal">经史舆图</div>
      <div class="meta">--font-seal · ZCOOL XiaoWei</div>
    </div>
  </div>
</body>
