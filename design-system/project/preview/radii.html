<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; justify-items: center; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 60px; height: 60px; background: var(--c-ink); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
<body>
  <div class="label">CORNER RADII · 圆角 (crisp)</div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:0"></div><div class="nm">--r-0 · 0</div></div>
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="nm">--r-1 · 2</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="nm">--r-2 · 4</div></div>
    <div class="item"><div class="box" style="border-radius:6px;background:var(--c-vermillion)"></div><div class="nm">--r-seal · 6</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">--r-3 · 8</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">--r-4 · 12</div></div>
  </div>
</body>
