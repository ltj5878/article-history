<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); height: 100%; }
  body { padding: 18px 24px; color: var(--fg); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .label { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
  .col { display: flex; flex-direction: column; }
  .h { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; color: var(--fg); }
  .horiz p { font-family: var(--font-serif); font-size: 16px; line-height: 1.9; color: var(--fg); margin: 0; }
  .vert {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--font-serif);
    font-size: 16px;
    line-height: 2.2;
    letter-spacing: 0.05em;
    height: 180px;
    color: var(--fg);
  }
  .vert .punct { letter-spacing: 0; }
</style>
<body>
  <div class="col">
    <div class="label">横排 Horizontal</div>
    <div class="horiz">
      <p>晋侯、宋公、齐国归父、崔夭、秦小子憖次于城濮。子玉使斗勃请战，曰：「请与君之士戏，君冯轼而观之。」</p>
    </div>
  </div>
  <div class="col">
    <div class="label">竖排 Vertical-RL</div>
    <div class="vert">晋侯、宋公、齐国归父、崔夭、秦小子憖次于城濮。子玉使斗勃请战。</div>
  </div>
</body>
