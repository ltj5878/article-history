<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; font-family: var(--font-sans); color: var(--fg); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(9, 1fr); }
  .swatch { border-radius: var(--r-2); padding: 10px; min-height: 70px; display: flex; flex-direction: column; justify-content: space-between; color: #F5F0E8; }
  .name { font-size: 12px; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .sub { font-size: 9px; opacity: 0.75; }
</style>
<body>
  <div class="label">FACTION PALETTE · 战国诸侯 / 春秋大国</div>
  <div class="grid">
    <div class="swatch" style="background:#2B4490;"><div class="name">晋 Jin</div><div class="hex">#2B4490</div></div>
    <div class="swatch" style="background:#C41E24;"><div class="name">楚 Chu</div><div class="hex">#C41E24</div></div>
    <div class="swatch" style="background:#6B3F1D;"><div class="name">秦 Qin</div><div class="hex">#6B3F1D</div></div>
    <div class="swatch" style="background:#C8893A;"><div class="name">齐 Qi</div><div class="hex">#C8893A</div></div>
    <div class="swatch" style="background:#6B8E5A;"><div class="name">宋 Song</div><div class="hex">#6B8E5A</div></div>
    <div class="swatch" style="background:#8B572A;"><div class="name">韩 Han</div><div class="hex">#8B572A</div></div>
    <div class="swatch" style="background:#4A6FB0;"><div class="name">魏 Wei</div><div class="hex">#4A6FB0</div></div>
    <div class="swatch" style="background:#7BA098;"><div class="name">赵 Zhao</div><div class="hex">#7BA098</div></div>
    <div class="swatch" style="background:#3B3328;"><div class="name">燕 Yan</div><div class="hex">#3B3328</div></div>
  </div>
</body>
