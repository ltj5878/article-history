<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; align-items: center; justify-items: center; }
  .ic { width: 28px; height: 28px; color: var(--fg-2); }
  .nm { font-size: 10px; font-family: var(--font-mono); color: var(--fg-3); margin-top: 6px; text-align: center; }
  .cell { display: flex; flex-direction: column; align-items: center; }
</style>
<body>
  <div class="label">ICONOGRAPHY · UI 图标 (1.5px stroke, 24px viewbox)</div>
  <div class="row">
    <div class="cell"><img class="ic" src="../assets/icons/book.svg"><div class="nm">book</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/chapter.svg"><div class="nm">chapter</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/vertical.svg"><div class="nm">vertical</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/horizontal.svg"><div class="nm">horizontal</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/translation.svg"><div class="nm">translation</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/layer-place.svg"><div class="nm">layer-place</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/layer-route.svg"><div class="nm">layer-route</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/layer-territory.svg"><div class="nm">layer-terr.</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/search.svg"><div class="nm">search</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/play.svg"><div class="nm">play</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/pause.svg"><div class="nm">pause</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/replay.svg"><div class="nm">replay</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/zoom-in.svg"><div class="nm">zoom-in</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/zoom-out.svg"><div class="nm">zoom-out</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/recenter.svg"><div class="nm">recenter</div></div>
    <div class="cell"><img class="ic" src="../assets/icons/bookmark.svg"><div class="nm">bookmark</div></div>
  </div>
</body>
