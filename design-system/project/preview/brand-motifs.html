<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .stack > div { margin-bottom: 14px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-bottom: 4px; }
</style>
<body>
  <div class="label">DECORATIVE MOTIFS · 装饰纹样</div>
  <div class="stack">
    <div>
      <div class="cap">cloud-band.svg · 云纹 · section divider</div>
      <img src="../assets/cloud-band.svg" width="100%" height="20" preserveAspectRatio="none">
    </div>
    <div>
      <div class="cap">yun-rule.svg · 回纹 · hairline rule</div>
      <img src="../assets/yun-rule.svg" width="100%" height="12" preserveAspectRatio="none">
    </div>
    <div>
      <div class="cap">wave-mountain.svg · 海水江崖纹 · footer / endpaper</div>
      <img src="../assets/wave-mountain.svg" width="100%" height="50" preserveAspectRatio="none">
    </div>
  </div>
</body>
