<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  img { display: block; }
</style>
<body>
  <div class="label">BRAND MARKS · 标识与印章</div>
  <div class="row">
    <div class="col">
      <img src="../assets/logo.svg" width="220" height="80" alt="logo">
      <div class="cap">logo · primary</div>
    </div>
    <div class="col">
      <img src="../assets/seal-square.svg" width="60" height="60" alt="seal">
      <div class="cap">seal-square · 4-char</div>
    </div>
    <div class="col">
      <img src="../assets/seal-du.svg" width="50" height="50" alt="du seal">
      <div class="cap">seal-du · 读</div>
    </div>
  </div>
</body>
