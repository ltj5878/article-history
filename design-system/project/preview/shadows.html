<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; justify-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 50px; background: var(--surface); border: 1px solid var(--border); }
  .sh1 { box-shadow: var(--sh-1); }
  .sh2 { box-shadow: var(--sh-2); }
  .sh3 { box-shadow: var(--sh-3); }
  .seal { background: var(--c-vermillion); border-color: var(--c-vermillion-2); box-shadow: var(--sh-seal); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
<body>
  <div class="label">SHADOW SYSTEM · 阴影 (warm-black, low alpha)</div>
  <div class="row">
    <div class="item"><div class="box sh1"></div><div class="nm">--sh-1</div></div>
    <div class="item"><div class="box sh2"></div><div class="nm">--sh-2</div></div>
    <div class="item"><div class="box sh3"></div><div class="nm">--sh-3</div></div>
    <div class="item"><div class="box seal"></div><div class="nm">--sh-seal</div></div>
  </div>
</body>
