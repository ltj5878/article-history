<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px; }
  .axis {
    position: relative; height: 56px; margin: 0 12px;
    border-top: 1px solid var(--rule);
  }
  .axis::after { content:""; position:absolute; left:-6px; right:-6px; top:-1px; height:1px; background: var(--rule); }
  .tick { position: absolute; top: -4px; width: 1px; height: 8px; background: var(--c-ink-2); }
  .ev {
    position: absolute; top: -10px; transform: translateX(-50%);
    width: 14px; height: 14px; border-radius: 50%; background: var(--c-vermillion); border: 2px solid var(--c-paper);
    box-shadow: var(--sh-1);
  }
  .lbl {
    position: absolute; top: 14px; transform: translateX(-50%);
    font-family: var(--font-serif); font-size: 11px; color: var(--fg-2); white-space: nowrap;
  }
  .yr {
    position: absolute; top: 32px; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);
  }
  .scrubber { position: absolute; top: -10px; width: 2px; height: 20px; background: var(--c-ink); transform: translateX(-1px); }
  .handle { position: absolute; top: -16px; transform: translateX(-50%); width: 12px; height: 12px; background: var(--c-vermillion); border: 2px solid var(--c-paper); border-radius: 50%; box-shadow: var(--sh-2); }
</style>
<body>
  <div class="label">TIMELINE · 时间轴 (春秋·战国·秦汉)</div>
  <div class="axis">
    <div class="tick" style="left: 5%;"></div>
    <div class="tick" style="left: 25%;"></div>
    <div class="tick" style="left: 50%;"></div>
    <div class="tick" style="left: 70%;"></div>
    <div class="tick" style="left: 95%;"></div>

    <div class="ev" style="left: 12%;"></div>
    <div class="lbl" style="left: 12%;">城濮之战</div>
    <div class="yr" style="left: 12%;">前 632</div>

    <div class="ev" style="left: 32%;"></div>
    <div class="lbl" style="left: 32%;">崤之战</div>
    <div class="yr" style="left: 32%;">前 627</div>

    <div class="ev" style="left: 60%;"></div>
    <div class="lbl" style="left: 60%;">巨鹿之战</div>
    <div class="yr" style="left: 60%;">前 207</div>

    <div class="ev" style="left: 80%;"></div>
    <div class="lbl" style="left: 80%;">垓下之围</div>
    <div class="yr" style="left: 80%;">前 202</div>

    <div class="scrubber" style="left: 60%;"></div>
    <div class="handle" style="left: 60%;"></div>
  </div>
</body>
