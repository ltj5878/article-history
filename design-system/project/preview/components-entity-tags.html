<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 22px 24px; color: var(--fg); font-family: var(--font-serif); font-size: 17px; line-height: 1.9; }
  .label { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
  .legend { display: flex; gap: 18px; margin-bottom: 12px; font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 2px; }
  p { margin: 0; }
</style>
<body>
  <div class="label">ENTITY TAGS · 文中标注</div>
  <div class="legend">
    <span><span class="dot" style="background:#2B4490"></span>地名</span>
    <span><span class="dot" style="background:#C8893A"></span>人物</span>
    <span><span class="dot" style="background:#6B8E5A"></span>事件</span>
  </div>
  <p>
    <span class="ent ent-person">晋侯</span>、<span class="ent ent-person">宋公</span>、<span class="ent ent-person">齐国归父</span>次于<span class="ent ent-place">城濮</span>。<span class="ent ent-person">子玉</span>使<span class="ent ent-person">斗勃</span>请战，<span class="ent ent-event">城濮之战</span>遂兴。<span class="ent ent-place">楚军</span>败绩，退于<span class="ent ent-place">连谷</span>。
  </p>
</body>
