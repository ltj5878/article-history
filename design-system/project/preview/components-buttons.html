<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr 1fr; }
  .group .gl { font-size: 10px; color: var(--fg-3); margin-bottom: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font-family: var(--font-sans); font-size: 13px; padding: 8px 14px; border-radius: var(--r-2); border: 1px solid transparent; cursor: pointer; transition: background var(--dur-1) var(--ease-ink); }
  .primary { background: var(--c-vermillion); color: #F5F0E8; border-color: var(--c-vermillion-2); }
  .primary:hover { background: var(--c-vermillion-2); }
  .secondary { background: var(--surface); color: var(--fg); border-color: var(--border-2); }
  .secondary:hover { background: var(--surface-2); }
  .ghost { background: transparent; color: var(--fg-2); }
  .ghost:hover { background: var(--surface-2); }
  .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--r-2); overflow: hidden; }
  .seg button { border-radius: 0; border: 0; border-right: 1px solid var(--border); background: var(--surface); }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--c-ink); color: var(--c-paper); }
</style>
<body>
  <div class="label">BUTTONS · 按钮</div>
  <div class="grid">
    <div class="group">
      <div class="gl">Primary</div>
      <div class="row">
        <button class="primary">阅读</button>
        <button class="primary">查看原文</button>
      </div>
    </div>
    <div class="group">
      <div class="gl">Secondary</div>
      <div class="row">
        <button class="secondary">译文</button>
        <button class="secondary">回到地图</button>
      </div>
    </div>
    <div class="group">
      <div class="gl">Segmented</div>
      <div class="seg">
        <button class="active">原文</button>
        <button>译文</button>
        <button>对照</button>
      </div>
    </div>
  </div>
</body>
