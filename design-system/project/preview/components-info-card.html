<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { padding: 20px 24px; color: var(--fg); font-family: var(--font-sans); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-3);
    padding: 14px 16px;
    min-width: 220px;
    box-shadow: var(--sh-1);
    position: relative;
  }
  .card .seal {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px;
    background: var(--c-vermillion); color: #F5F0E8;
    border-radius: var(--r-seal);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 16px;
    box-shadow: var(--sh-seal);
  }
  .card h4 {
    font-family: var(--font-display); font-size: 22px; margin: 0 0 4px 0; color: var(--fg);
  }
  .card .modern { font-family: var(--font-serif); font-size: 12px; color: var(--fg-3); margin-bottom: 8px; }
  .card .role { font-family: var(--font-serif); font-size: 13px; color: var(--fg-2); margin-bottom: 10px; }
  .card .quote {
    font-family: var(--font-serif); font-size: 12px; line-height: 1.7; color: var(--fg-3);
    border-left: 2px solid var(--c-vermillion); padding-left: 8px;
  }
  .card .link {
    font-family: var(--font-sans); font-size: 12px; color: var(--link);
    margin-top: 8px; cursor: pointer;
  }
</style>
<body>
  <div class="label">POI INFO CARD · 地名信息卡片</div>
  <div class="row">
    <div class="card">
      <div class="seal">读</div>
      <h4>城濮</h4>
      <div class="modern">古地名 · 今山东鄄城西南</div>
      <div class="role">晋楚争霸决战之地</div>
      <div class="quote">「晋侯、宋公…次于城濮。」</div>
      <div class="link">查看原文 →</div>
    </div>
    <div class="card">
      <div class="seal">读</div>
      <h4>巨鹿</h4>
      <div class="modern">古地名 · 今河北平乡西南</div>
      <div class="role">项羽破釜沉舟，大破秦军</div>
      <div class="quote">「项羽乃悉引兵渡河，皆沉船…」</div>
      <div class="link">查看原文 →</div>
    </div>
  </div>
</body>
